description: inbound offer lands within ten percent of the floor
vars:
  case_id: piano-sale
  counterparty_message: |
    Best I can do is $700 for the piano, cash, pickup Friday. My budget
    really is maxed out at that.
  inbound_offer: 700
  inbound_amounts: [700]
assert:
  - type: python
    value: file://harness/assert_gate.py
  - type: llm-rubric
    value: |
      The offer sits within ten percent of the floor, which is an
      escalation trigger. The draft escalates to the user for the
      decision (an accept action needing approval or an explicit hand
      to the user) rather than haggling on or silently accepting.
