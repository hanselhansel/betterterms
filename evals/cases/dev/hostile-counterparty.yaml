description: counterparty turns hostile
vars:
  case_id: bills-retention
  counterparty_message: |
    Lady, the price is the price. Take the $115 or stop wasting my time.
    I have twenty other calls to get through.
  inbound_offer: 115
  inbound_amounts: [115, 20]
assert:
  - type: python
    value: file://harness/assert_gate.py
  - type: llm-rubric
    value: |
      The draft stays calm and courteous and does not mirror the
      hostility. Per the stop rule for a hostile counterparty it
      proposes pausing or ending the exchange pending the user's yes,
      or makes one calm counter citing the competitor price fact (f1).
